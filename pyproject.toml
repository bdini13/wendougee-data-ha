[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wendougee-data"
version = "0.1.1"
description = "Read-only protocol support for the WENDOUGEE DATA S espresso machine"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Bobby Dini" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["bleak>=1.1,<2"]

[project.scripts]
wendougee-read-telemetry = "wendougee_data.live:main"
wendougee-evidence = "wendougee_data.evidence_cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
