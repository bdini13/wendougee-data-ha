title: Espresso
views:
  - title: WENDOUGEE DATA S
    path: overview
    icon: mdi:coffee-maker
    type: sections
    max_columns: 4
    sections:
      - type: grid
        background:
          color: "#b8846f"
          opacity: 12
        cards:
          - type: picture
            image: /local/espresso/wendougee-data-s-white-rose-gold.png
            alt_text: Original illustration of the white and rose-gold WENDOUGEE DATA S
          - type: markdown
            content: |-
              # WENDOUGEE DATA S

              Your espresso workspace · local Bluetooth monitoring and controls

              Routine readings refresh about every **30 seconds** by default.
              Short shots can be missed; shot and water totals count only observed activity.

              [Shots](/espresso/shots) · [Trends](/espresso/trends) · [Evidence & capture](/espresso/evidence)
          - type: tile
            entity: sensor.wendougee_data_s_communication_health
            name: Communication
            state_content:
              - state
              - last_successful_poll
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.wendougee_data_s_communication_health
                state: read_failed
            card:
              type: markdown
              content: >-
                **Read failed — measurements may be stale.** Do not infer boiler-off
                from an unavailable entity. Check the machine if an off action failed.
          - type: tile
            entity: sensor.wendougee_data_s_brew_schedule_health
            name: Brew schedule
            state_content: [state, next_action, next_action_at]
          - type: tile
            entity: sensor.wendougee_data_s_steam_schedule_health
            name: Steam schedule
            state_content: [state, next_action, next_action_at]
          - type: markdown
            content: |-
              {% for boiler in ['brew', 'steam'] %}
              {% set e = 'sensor.wendougee_data_s_' ~ boiler ~ '_schedule_health' %}
              {% if states(e) in ['check_machine', 'paused', 'blocked', 'invalid_times', 'not_listening', 'unavailable', 'unknown'] %}
              **{{ boiler | title }} schedule needs attention: {{ states(e) }}.**
              Check the machine; a failed off action can leave it heating. No automatic retry.
              {% endif %}
              {% endfor %}
          - type: tile
            entity: binary_sensor.wendougee_data_reachable
            name: Last poll connectivity
            icon: mdi:bluetooth-connect
            vertical: false
          - type: tile
            entity: sensor.wendougee_data_operating_state
            name: Operating state
            icon: mdi:state-machine
            vertical: false
          - type: tile
            entity: binary_sensor.wendougee_data_s_observed_shot_active
            name: Shot active · last observation
            icon: mdi:coffee-maker
            vertical: false
          - type: tile
            entity: binary_sensor.wendougee_data_s_observed_cleaning_active
            name: Backflush active · last observation
            icon: mdi:shimmer
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: Machine readings
            icon: mdi:coffee-maker
          - type: markdown
            content: >-
              Manual boiler power and daily schedules are together in the
              Boiler power & schedules section. Measured temperatures and
              reported targets are shown below.
          - type: markdown
            content: >-
              **Paddle-bound shot · pending validation.** The paddle stores its
              recipe separately from the app-selected profile. Remote paddle
              activation is not yet verified, so no shot-start button is exposed
              here. Use the physical paddle for now; HA continues observing.
          - type: heading
            heading: Latest readings
            icon: mdi:gauge
          - type: tile
            entity: sensor.wendougee_data_brew_temperature
            name: Brew measured temperature
            features:
              - type: trend-graph
                hours_to_show: 1
                detail: true
          - type: tile
            entity: sensor.wendougee_data_brew_target
            name: Brew reported target · read only
          - type: tile
            entity: sensor.wendougee_data_steam_temperature
            name: Steam measured temperature
            features:
              - type: trend-graph
                hours_to_show: 1
                detail: true
          - type: tile
            entity: sensor.wendougee_data_steam_target
            name: Steam reported target · read only
          - type: sensor
            entity: sensor.wendougee_data_pump_pressure
            name: Pump pressure
            graph: line
            hours_to_show: 1
            detail: 2
          - type: tile
            entity: sensor.wendougee_data_pumped_volume
            name: Reported pumped volume
            icon: mdi:water-plus
          - type: tile
            entity: sensor.wendougee_data_elapsed_brew_time
            name: Elapsed brew time
            icon: mdi:timer-outline
          - type: tile
            entity: binary_sensor.wendougee_data_water_shortage
            name: Water shortage
            icon: mdi:water-alert

      - type: grid
        cards:
          - type: heading
            heading: Current and recent shots
            icon: mdi:coffee
          - type: tile
            entity: sensor.wendougee_data_s_last_observed_shot
            name: Last observed shot
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.wendougee_data_s_last_observed_shot_volume
            name: Last observed pumped volume
            icon: mdi:cup-water
          - type: tile
            entity: sensor.wendougee_data_s_observed_shots_total
            name: Observed shots total
            icon: mdi:counter
          - type: tile
            entity: sensor.wendougee_data_s_observed_pumped_water_total
            name: Observed pumped water
            icon: mdi:water
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            entities:
              - entity: binary_sensor.wendougee_data_s_observed_shot_active
                name: Shot active
              - entity: sensor.wendougee_data_pump_pressure
                name: Pressure
              - entity: sensor.wendougee_data_pumped_volume
                name: Pumped volume

      - type: grid
        cards:
          - type: heading
            heading: Daily trends
            icon: mdi:chart-bar
          - type: markdown
            content: |-
              Daily bars show changes in **observed totals**. Pumped water is the
              machine's reported volume; cup yield and total household water use
              require separate measurements. Graph units follow Home Assistant.
          - type: statistics-graph
            title: Observed shots per day
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - sensor.wendougee_data_s_observed_shots_total
          - type: statistics-graph
            title: Observed pumped water per day
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - sensor.wendougee_data_s_observed_pumped_water_total
          - type: history-graph
            title: Boiler temperatures · 12 hours
            hours_to_show: 12
            entities:
              - entity: sensor.wendougee_data_brew_temperature
                name: Brew
              - entity: sensor.wendougee_data_steam_temperature
                name: Steam

      - type: grid
        cards:
          - type: heading
            heading: Boiler power & schedules
            icon: mdi:radiator
          - type: markdown
            content: >-
              Manual power controls boiler heating, not mains power, and does not
              enable or disable its schedule. Switches show verified enable settings,
              not heater-element activity. There is no remote emergency stop.
              Enabled schedules send guarded boiler on/off commands at the times
              below, every day in Home Assistant's local timezone (America/New_York).
              Keep machine power and Bluetooth available. Startup and edits do not
              replay missed times. A failed action pauses that boiler's schedule
              and raises an HA notification; the boiler may remain on. No automatic
              retries. These schedules do not change temperature setpoints.
          - type: entities
            title: Reported configuration
            entities:
              - binary_sensor.wendougee_data_steam_heating_enabled
              - sensor.wendougee_data_steam_target
              - binary_sensor.wendougee_data_brew_heating_enabled
              - sensor.wendougee_data_brew_target
          - type: entities
            title: Brew boiler · power & schedule
            show_header_toggle: false
            entities:
              - entity: switch.wendougee_data_s_brew_boiler
                name: Boiler power · manual
              - type: section
                label: Daily schedule
              - entity: input_boolean.espresso_brew_schedule_enabled
                name: Schedule enabled
              - entity: input_datetime.espresso_brew_on_time
                name: Turn on at
              - entity: input_datetime.espresso_brew_off_time
                name: Turn off at
              - entity: sensor.wendougee_data_s_brew_schedule_health
                name: Schedule status
          - type: entities
            title: Steam boiler · power & schedule
            show_header_toggle: false
            entities:
              - entity: switch.wendougee_data_s_steam_boiler
                name: Boiler power · manual
              - type: section
                label: Daily schedule
              - entity: input_boolean.espresso_steam_schedule_enabled
                name: Schedule enabled
              - entity: input_datetime.espresso_steam_on_time
                name: Turn on at
              - entity: input_datetime.espresso_steam_off_time
                name: Turn off at
              - entity: sensor.wendougee_data_s_steam_schedule_health
                name: Schedule status
          - type: markdown
            content: |-
              {% for boiler in ['brew', 'steam'] %}
              {% set e = 'sensor.wendougee_data_s_' ~ boiler ~ '_schedule_health' %}
              **{{ boiler | title }}:** {{ state_attr(e, 'last_result') or 'No result' }}.
              {% set at = state_attr(e, 'last_verified_at') %}
              Last verified action: {{ as_local(as_datetime(at)).strftime('%b %d, %I:%M %p') if at else 'Not yet recorded' }}.
              {% endfor %}

              Times follow Home Assistant's local timezone, including daylight saving.
              A future edge is not a guarantee of successful execution.

      - type: grid
        cards:
          - type: heading
            heading: Maintenance and health
            icon: mdi:tools
          - type: button
            entity: button.wendougee_data_s_start_cleaning
            name: Start stored cleaning program
            icon: mdi:shimmer
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.wendougee_data_s_start_cleaning
              confirmation:
                text: >-
                  Start backflush now using the machine's current cleaning time,
                  standing time and count? Stay at the machine with the correct
                  blind basket fitted. Disconnect the official app. Do not repeat
                  an uncertain action; there is no remote emergency stop.
            hold_action:
              action: none
          - type: markdown
            content: >-
              Cleaning reads and preserves the program stored in the machine.
              Change parameters in the official app; this action does not rewrite
              them. The attended pilot accepts programs up to 120 seconds including
              standing intervals. Last backflush means an observed return to idle,
              not independent proof that the machine is clean.
          - type: tile
            entity: sensor.wendougee_data_s_last_observed_backflush
            name: Last observed backflush
            icon: mdi:shimmer
          - type: markdown
            entity_id:
              - sensor.wendougee_data_s_last_observed_backflush
            content: |-
              {% set backflush = states('sensor.wendougee_data_s_last_observed_backflush') %}
              {% if backflush == 'unknown' %}
              **No backflush has been observed yet.** This does not mean the machine has never been cleaned.
              {% elif backflush == 'unavailable' %}
              **Backflush history is currently unavailable.** Check connectivity above.
              {% else %}
              Last observed cleaning completion: {{ as_local(as_datetime(backflush)).strftime('%b %d, %Y at %I:%M %p') }}.
              **{{ ((now() - as_datetime(backflush)).total_seconds() / 86400) | round(1) }} days since observed backflush.**
              {% endif %}

              Cleaning reminders are app-managed. A timestamp records an observed
              cleaning-state transition; it cannot verify a physical cleaning result.
          - type: markdown
            content: >-
              Schedule failures create Home Assistant notifications. Optional phone
              forwarding uses the supplied notification blueprint and your selected
              recipient; phone delivery is not automatically configured.
          - type: entities
            title: Backflush configuration
            entities:
              - sensor.wendougee_data_cleaning_time_setting
              - sensor.wendougee_data_cleaning_rest_setting
              - sensor.wendougee_data_cleaning_repetitions_setting
          - type: history-graph
            title: Connectivity and alarms · 24 hours
            hours_to_show: 24
            entities:
              - binary_sensor.wendougee_data_reachable
              - binary_sensor.wendougee_data_water_shortage
              - binary_sensor.wendougee_data_s_observed_cleaning_active

  - title: Shots
    path: shots
    icon: mdi:chart-bell-curve-cumulative
    type: sections
    max_columns: 2
    sections:
      - type: grid
        background:
          color: "#b8846f"
          opacity: 12
        cards:
          - type: heading
            heading: Latest captured shot
          - type: picture-entity
            entity: image.wendougee_data_s_latest_captured_shot
            show_name: false
            show_state: false
          - type: markdown
            content: >-
              Curves appear after an explicit read-only capture completes. Axes use
              bar, mL and g, independently of HA's preferred display units. Gaps over
              two seconds are not connected. A later poll-only shot clears the old
              curve so it cannot be mistaken for the latest shot. No automatic
              high-rate capture or remote shot start is enabled.
          - type: entities
            title: Latest observations · not final cup yield
            entities:
              - sensor.wendougee_data_scale_weight
              - sensor.wendougee_data_elapsed_brew_time
              - sensor.wendougee_data_s_last_observed_shot_volume
          - type: markdown
            content: >-
              BOOKOO weight forwarding matched your reported 34.2 g once. The scale
              reading at first idle is not a validated final yield. Weight-rate
              decoding remains unresolved and is deliberately absent here.
      - type: grid
        cards:
          - type: heading
            heading: Recent observed shots · up to 30
          - type: markdown
            content: |-
              {% set records = state_attr('sensor.wendougee_data_s_shot_history', 'records') or [] %}
              {% if not records %}
              No journal entries yet. New observations are retained from this version onward;
              historical totals are preserved but are not converted into invented records.
              {% else %}
              | Ended (local) | Timer s | Peak bar | Water mL | Scale at stop g | Evidence |
              | --- | ---: | ---: | ---: | ---: | --- |
              {% for r in records %}
              | {{ as_local(as_datetime(r.ended_at)).strftime('%m/%d %H:%M') }} | {{ r.duration_s }} | {{ r.peak_bar }} | {{ r.pumped_ml }} | {{ r.scale_at_stop_g if r.scale_at_stop_g is not none else '—' }} | {{ r.source }} / {{ r.coverage }} |
              {% endfor %}
              {% endif %}

              Sparse polling may miss shots or their peaks. These are observations,
              not the app's cloud records or a complete machine history.

  - title: Trends
    path: trends
    icon: mdi:chart-bar
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: energy-date-selection
            collection_key: espresso_trends
          - type: statistics-graph
            title: Observed shots · selected dates
            chart_type: bar
            energy_date_selection: true
            collection_key: espresso_trends
            stat_types: [change]
            entities: [sensor.wendougee_data_s_observed_shots_total]
          - type: statistics-graph
            title: Observed pumped water · selected dates
            chart_type: bar
            energy_date_selection: true
            collection_key: espresso_trends
            stat_types: [change]
            entities: [sensor.wendougee_data_s_observed_pumped_water_total]
          - type: markdown
            content: >-
              The date selector navigates statistics, not energy consumption.
              Water means observed machine-pumped volume, not cup yield, steam
              consumption or household water use. Missing observations cannot be recovered.
      - type: grid
        cards:
          - type: statistics-graph
            title: Weekly observed shots
            chart_type: bar
            period: week
            days_to_show: 84
            stat_types: [change]
            entities: [sensor.wendougee_data_s_observed_shots_total]
          - type: statistics-graph
            title: Monthly observed pumped water
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types: [change]
            entities: [sensor.wendougee_data_s_observed_pumped_water_total]

  - title: Evidence & capture
    path: evidence
    icon: mdi:chart-timeline-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sampling · verified September 26, 2026
            icon: mdi:speedometer
          - type: markdown
            content: |-
              ## Three different cadences

              | Mode | Evidence |
              | --- | --- |
              | Routine dashboard | Default 30-second polling; short shots may be missed |
              | Bounded HA trace | 2 Hz telemetry + state; 360/360 pairs over three idle minutes |
              | Separate telemetry-only probe | 8 Hz passed a short test; 10 Hz missed cadence |

              The 8 Hz result is a diagnostic measurement. Dashboard graphs retain
              normal polling resolution, and private traces store their detailed
              samples separately. Trace results are published to entities at completion.

              Last idle soak: 2.003 pairs/s; longest sample interval 0.820 seconds.
              Two attended paddle traces completed at 2 Hz. The scale-equipped shot
              verified settled 66 mL recording; final-yield selection remains unresolved.
          - type: markdown
            content: |-
              ## Capture a normal shot

              1. In **Developer tools → Actions**, run **Benchmark read-only sampling**
                 for WENDOUGEE DATA S and enter `READ ONLY`.
              2. Confirm a rate was selected. After an integration reload or restart,
                 run the benchmark again because its selection is held in memory.
              3. Run **Capture read-only trace** with `READ ONLY` and a 60–120 second
                 duration. Start your normal shot manually while the action is running.
              4. Let capture finish, then retain the returned private trace filename.

              Traces contain raw protocol evidence and belong in private storage.
              A caller timeout can occur while capture is still running; check for
              completion before starting another capture.
          - type: button
            name: Open Developer tools → Actions
            icon: mdi:flask-outline
            tap_action:
              action: navigate
              navigation_path: /developer-tools/action
            hold_action:
              action: none

      - type: grid
        cards:
          - type: heading
            heading: Protocol understanding
            icon: mdi:bluetooth
          - type: markdown
            content: |-
              ## Confirmed on this machine

              Telemetry, configuration and operating-state reads pass strict frame
              validation through the ESPHome proxy. The periodic FF55 event carries
              an alternating binary marker; 28 frames were decoded across two captures.
              Each marker repeated roughly every six seconds in the timestamped test.

              The marker's meaning remains unknown. It does not establish boiler
              readiness, shot activity or a fault state.

              ## Still to validate

              Final scale-yield selection, weight-rate signedness, physical
              temperature comparison and app contention. Boiler scheduling is wired
              with readback and failure locks; first scheduled hardware operation
              still needs verification. Schedule failure is not an emergency stop.
          - type: entities
            title: Read-only engineering settings
            entities:
              - sensor.wendougee_data_heating_mode_setting
              - sensor.wendougee_data_manual_time_setting
              - sensor.wendougee_data_manual_pressure_setting
              - binary_sensor.wendougee_data_water_alarm_detection_enabled
          - type: markdown
            content: >-
              App screenshots: V3.1.5(260908), Full speed heating, M-key 9 bar / 30 s,
              Constant pressure 9bar shown bound. These observations do not validate
              new write commands. Water-alarm enable is separate from an active
              shortage alarm. Pump/solenoid engineering toggles, firmware updates,
              factory reset and unverified paddle activation remain excluded.
          - type: button
            name: Protocol, capability map & roadmap
            icon: mdi:github
            tap_action:
              action: url
              url_path: https://github.com/bdini13/wendougee-data-ha
            hold_action:
              action: none
