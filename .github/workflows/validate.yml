name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/wendougee_data/manifest.json >/dev/null
          python -m json.tool custom_components/wendougee_data/strings.json >/dev/null
          python -m json.tool hacs.json >/dev/null
