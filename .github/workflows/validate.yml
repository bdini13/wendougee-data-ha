name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'research/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'research/**'
  workflow_dispatch:

# A newer commit supersedes an in-flight run for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Compile Python
        run: python -m compileall -q src custom_components tests scripts
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/wendougee_data/manifest.json >/dev/null
          python -m json.tool custom_components/wendougee_data/strings.json >/dev/null
          python -m json.tool custom_components/wendougee_data/translations/en.json >/dev/null
          python -m json.tool .github/labels.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  home-assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - name: Install pinned Home Assistant test runtime
        run: python -m pip install -r requirements-ha-test.txt
      - name: Build self-contained integration
        run: python scripts/build_integration.py
      - name: Test Home Assistant with simulated Bluetooth and network disabled
        run: python -m pytest -c pytest-ha.ini
